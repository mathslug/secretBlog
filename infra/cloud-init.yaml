#cloud-config
# Minimal bootstrap for the slugclub droplet. Everything real (Node, Caddy,
# swap, systemd units) is installed idempotently by deploy/deploy.sh on the
# first GitHub Actions deploy — so a bare Ubuntu 24.04 droplet with SSH access
# is all this needs to provide.
package_update: true
packages:
  - ca-certificates
  - curl
  - rsync
